# govulncheck against the Go vulnerability database. Runs on pushes that can
# change the dependency graph and weekly on a cron, so new advisories surface
# between commits. Only flags vulnerable code that is actually reachable.
name: vuln

on:
  push:
    branches: [main]
    paths: ["go.mod", "go.sum", "**.go"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
