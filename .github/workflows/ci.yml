# CI for every push to main and every PR (dependabot included). One small Go
# service, so one fast workflow: format, vet, lint, race-enabled tests, and
# module hygiene, all in parallel. No build job: go test compiles everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:" && echo "$out" && exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # Default linter set (errcheck, govet, ineffassign, staticcheck, unused)
      # is exactly the focused set we want, so no .golangci.yml to maintain.
      - uses: golangci/golangci-lint-action@v8

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # -race because the orchestrator's whole point is concurrent fan-out;
      # -count=1 so cached results can't hide a flaky test.
      - run: go test -race -count=1 ./...

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go.mod and go.sum match the imports
        # The `--` form tolerates go.sum not existing (no external deps yet).
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
